# Text-to-speech (voice channel reader). Edited here or from the admin dashboard.
# Slash-command choices (voices) are fixed at startup; everything else reloads with the config.

settings:
    default-voice: "alpha"
    max-chars: 400          # longer messages are cut at a word boundary
    chunk-chars: 120        # long messages are spliced at punctuation into parts of at most this size
    chunk-first-chars: 60   # the first part is shorter so speech starts sooner
    max-queue: 15           # messages waiting per server; extras are dropped
    announce-gap: 45        # seconds of silence after which the speaker is announced again
    synth-timeout: 20       # seconds to wait for a voice clip before skipping the message
    translate: true         # master switch: translate non-English messages to English before reading them (servers also have /server-settings vctranslatetoggle)
    translate-timeout: 6    # seconds to wait for DeepL before reading the original text instead

# Choices for /user-settings vcsetvoice and /server-settings vcsetvoice. key -> label shown in Discord.
# id is an edge-tts voice name, or "kokoro:<voice>" for the local Kokoro model.
# Kokoro ids can also set speed ("kokoro:af_heart@1.1"), pitch ("kokoro:af_heart^1.2", 1.2 = 20% higher)
# or blend voices ("kokoro:af_heart+af_bella"). Combine: "kokoro:af_heart+af_bella@1.08^1.2".
voices:
    heart:   { label: "Heart (Kokoro, US female)",    id: "kokoro:af_heart" }
    bella:   { label: "Bella (Kokoro, US female)",    id: "kokoro:af_bella" }
    nicole:  { label: "Nicole (Kokoro, US female)",   id: "kokoro:af_nicole" }
    sky:     { label: "Sky (Kokoro, US female)",      id: "kokoro:af_sky" }
    kore:    { label: "Kore (Kokoro, US female)",     id: "kokoro:af_kore" }
    sparkle: { label: "Sparkle (Kokoro, anime-ish blend)", id: "kokoro:af_heart+af_bella@1.08^1.2" }
    # Experimental: Japanese-trained Kokoro voices reading English (accented, but often very anime)
    alpha:   { label: "Alpha (Kokoro, Japanese voice, English text)",      id: "kokoro:jf_alpha@1.08^1.1" }
    nezumi:  { label: "Nezumi (Kokoro, Japanese voice, English text)",     id: "kokoro:jf_nezumi@1.08^1.2" }
    tebukuro: { label: "Tebukuro (Kokoro, Japanese voice, English text)",  id: "kokoro:jf_tebukuro@1.08^1.2" }
    gongitsune: { label: "Gongitsune (Kokoro, Japanese voice, English text)", id: "kokoro:jf_gongitsune@1.08^1.2" }
    emma_k:  { label: "Emma (Kokoro, UK female)",     id: "kokoro:bf_emma" }
    adam:    { label: "Adam (Kokoro, US male)",       id: "kokoro:am_adam" }
    aria:    { label: "Aria (US, female)",     id: "en-US-AriaNeural" }
    jenny:   { label: "Jenny (US, female)",    id: "en-US-JennyNeural" }
    emma:    { label: "Emma (US, female)",     id: "en-US-EmmaNeural" }
    guy:     { label: "Guy (US, male)",        id: "en-US-GuyNeural" }
    andrew:  { label: "Andrew (US, male)",     id: "en-US-AndrewNeural" }
    sonia:   { label: "Sonia (UK, female)",    id: "en-GB-SoniaNeural" }
    ryan:    { label: "Ryan (UK, male)",       id: "en-GB-RyanNeural" }
    natasha: { label: "Natasha (AU, female)",  id: "en-AU-NatashaNeural" }
    william: { label: "William (AU, male)",    id: "en-AU-WilliamNeural" }
    yu_original: { label: "Alpha x Sparkle (Kokoro, blend)", id: "kokoro:jf_alpha:0.5+af_heart:0.25+af_bella:0.25@1.05^1.15" }

