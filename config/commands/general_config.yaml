# Yu Perennia voicelines, drop-in replacements for the Rice Shower configs.
# Placeholders match the originals. Keep them intact.

# ---------- general_config.yaml ----------
desc: "Welcome in! Yu can help with all sorts of everyday server tasks!"
more-desc: "Provides essential utilities for common server tasks and basic interactions, with Yu serving them up nice and warm."

commands:
    greet:
        usage: "/greet or yp!greet"
        desc: "Yu greets you like a regular at Cafe Camellia!"
        textlines:
            - "Welcome in! Take any seat you like! ☕"
            - "Oh, hello! Perfect timing, the tea just finished steeping! 🌸"
            - "Hi hi! Yu Perennia, at your service! 🐐"
            - "Welcome to Cafe Camellia! ...Er, the server! Same thing, really! 🌼"
            - "Good to see you! Come in, come in, don't be shy! ✨"
            - "Hello, hello! Careful of the tray, it's hot! 🍵"
            - "Hey there! 6th Division's doors are always open! 🛡️"
            - "Baa-rilliant to see you! Hehe, sorry, couldn't resist! 💛"
            - "Oh! Hi! I was just wiping the tables. All clean now! 🌷"
            - "Welcome back! Your usual seat is waiting! 🌹"

    help:
        desc: "Yu shows you the menu of everything she can do!"
        more-desc: "Shows detailed information about all commands Yu can run, including usage and descriptions."

    ping:
        desc: "Yu checks how quickly she can deliver an order!"
        more-desc: "Measures Yu's current latency and returns the response time in milliseconds."
        format: "Order up! 🛎️ Latency is {}ms. Fresh and fast!"

    info:
        desc: "Yu tells you about herself and what she can do!"
        more-desc: "Returns general information about Yu Perennia, including her capabilities and current command support."
        text: "Yu Perennia is a cheerful goat demihuman who waits tables at Cafe Camellia and holds the line as a tank-supporter, and dependable acting leader, in NCC's 6th Division. She currently supports general commands, including **greetings**, **informational queries**, **dice rolls**, **coin flips**, **motivational quotes**, **message repetition**, and **random selection**. Leave it to her. She's sturdier than she looks!"

    quote:
        desc: "Yu serves you a little encouragement, on the house!"
        more-desc: "Provides a randomly selected motivational or encouraging message to support and uplift the user."
        textlines:
            - "Stay behind me! You don't have to carry it all by yourself! 🛡️"
            - "A good cup of tea fixes more than you'd think. Take a break! 🍵"
            - "Falling down is fine. Getting back up with friends is better! 🌸"
            - "Nobody gets left behind. That includes you! 💛"
            - "Small steps still get you across the room. Just don't spill the tea! ☕"
            - "If it gets tough, fall back to me. I've got you covered! 🐐"
            - "Being dependable isn't about never being tired. It's about showing up anyway! 🌼"
            - "You're doing great! ...And if not, tea's on me! ✨"
            - "Rest when you need to. The line will hold! 🌷"
            - "Every hard day ends. Then comes cake! 🍰"

    # Rice's umaline pulled lines from Uma Musume. Yu has no equivalent, so this
    # could be renamed (e.g. "yuline") and filled with these:
    umaline:
        desc: "Makes Yu say a random line from her day!"
        more-desc: "Displays a randomly selected prewritten line from Yu's daily life at Cafe Camellia and the 6th Division."
        textlines:
            - "🐐 The tables are wiped, the cups are polished... I should check the division's supply list before my break."
            - "🐐 Ehehe, sorry, I was chewing on... nothing! Definitely not the menu. Baa..."
            - "🐐 Acting leader means everyone's tea order AND everyone's safety. It's a lot, but I like it!"
            - "🐐 One pot of tea and a slice of cake, coming right up! Please wait just a moment!"
            - "🐐 I'm much sturdier than I look. Go on, give it your best shot!"
            - "🐐 After this mission, everyone's coming to the cafe. That's an order! ...A friendly one!"
            - "🐐 Honey cake sells out so fast. I always save one slice for the division!"

    say:
        desc: "Makes Yu repeat whatever you tell her to say!"
        more-desc: "Echoes the message typed by the user, allowing Yu to relay it exactly as entered. Say command cannot bypass filtered words"

    roll:
        desc: "Yu rolls a die and calls out the result!"
        more-desc: "Simulates a dice roll and outputs the result as a number."
        format: "Rolled a {outcome}! Order up! 🎲"

    8ball:
        desc: "Ask Yu a question and she'll give you her honest answer!"
        more-desc: "Provides a randomized answer to a user-submitted question, simulating a magic 8-ball response. Does not use AI"
        format-response: "🐐Response: {response}"
        format-question: "❓Question: {question}"
        textlines:
            - "Yes! Leave it to me!"
            - "Most likely! I've got a good feeling!"
            - "Definitely! Hold the line!"
            - "Hmm, ask again once the tea has cooled!"
            - "I'm not sure yet. Give me a moment to think!"
            - "Can't say right now, but we'll figure it out together!"
            - "No, I can't promise that, sorry!"
            - "Very doubtful... but I'd still stand by you!"
            - "Don't count on it. Let's try a different plan!"

    coinflip:
        desc: "Yu flips a coin and tells you the result!"
        more-desc: "Simulates a coin toss and outputs whether it landed on heads or tails."
        format: "It landed on {outcome}! Catch! 🪙"

    choose:
        desc: "Let Yu pick for you, like a waitress recommending a dish!"
        more-desc: "Selects one option from multiple user-provided choices and outputs the selected result.\nUser can use | or , with | being more dominant than ,"
        fallback: "Hm? I need at least two options to choose from!"
        format: "I recommend **{0}**! You won't regret it!"

# ---------- exception_config.yaml ----------
invalid_command: "Sorry, that's not on the menu! Check `!{prefix} help` or `/{prefix} help` for what I can do!"
missing_argument: "Oh, you forgot to give me something for `{command}`! Mind adding it?"
no_permission: "Sorry, I can't let you use `{command}`. Staff only!"

# ---------- translate_config.yaml ----------
command:
    format: "{flag} {text}"
    channel-set: "Got it! Yu will translate between English and {language} {flag} in this channel!"
    channel-off: "Okay, Yu will stop translating in this channel!"
    server-only: "Oh, changing translation only works inside a server channel!"
    unknown-language: "Yu knows Chinese and Japanese. Or say Off to stop!"
    off-with-text: "Off is only for turning translation off in a channel, not for translating text!"
    empty: "Hm? There's nothing here for me to translate!"
    unsupported: "Sorry, I couldn't find any text to translate in that!"
    not-configured: "Sorry, translation isn't set up yet. I need a DeepL key first!"
    quota: "Oh no, this month's translation quota has run out!"
    rate-limit: "Whoa, too many orders at once! Try again in a moment!"
    failed: "Sorry, that translation didn't come out right. Please try again!"

# ---------- mod_config.yaml ----------
mod_desc: "Yu will hold the line and keep the server safe!"
commands_mod:
    kick:
        more-desc: "Kicks a user from the server. Yu makes sure this is safe and justified before she does it."

# ---------- events (on_member_join / battle-style extras, optional) ----------
member_join:
    - "Welcome to the server! Take any seat you like! ☕"
    - "A new face! Come in, come in! Tea's on me! 🍵"
    - "Welcome aboard! The 6th Division's got room for one more! 🛡️"