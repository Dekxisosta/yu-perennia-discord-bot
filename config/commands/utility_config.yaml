desc: "Welcome in! Yu has a few handy tools ready for you!"
prefix: "util"

commands:
    translate:
        usage: "/translate <language> [text] | yp!translate <language> [text]"
        more-desc: "Sets this channel to auto-translate between English and Chinese or Japanese (or Off). Add text to translate it once instead."
        user-perms:
            - view_channel
            - send_messages
        bot-perms:
            - view_channel
            - send_messages
        desc: "Yu translates for you, so everyone at the table can understand each other! 🍵"